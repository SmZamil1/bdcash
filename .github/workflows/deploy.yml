name: Deploy BDCash to InfinityFree

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env File
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cat > core/.env << EOF
          APP_NAME="BDCash"
          APP_ENV=production
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=https://bdcash69.42web.io

          LOG_CHANNEL=stack

          ADMIN_ROUTE=admin

          DB_CONNECTION=mysql
          DB_HOST=sql303.infinityfree.com
          DB_PORT=3306
          DB_DATABASE=if0_42160647_cash
          DB_USERNAME=if0_42160647
          DB_PASSWORD=${DB_PASSWORD}

          BROADCAST_DRIVER=log
          CACHE_DRIVER=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120

          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379

          MAIL_MAILER=smtp
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=sadek@bdcash69.com
          MAIL_FROM_NAME="BDCash"

          PUSHER_APP_ID=
          PUSHER_APP_KEY=
          PUSHER_APP_SECRET=
          PUSHER_APP_CLUSTER=mt1
          MIX_PUSHER_APP_KEY=
          MIX_PUSHER_APP_CLUSTER=
          EOF
          sed -i 's/^[[:space:]]*//' core/.env

      - name: Fix Storage Permissions
        run: |
          chmod -R 775 core/storage
          chmod -R 775 core/bootstrap/cache
          find core/storage -type d -exec chmod 775 {} \;
          find core/bootstrap/cache -type d -exec chmod 775 {} \;

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
          dangerous-clean-slate: false
          log-level: minimal
