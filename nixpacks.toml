[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.curl",
  "php83Extensions.zip",
  "php83Extensions.gd",
  "php83Extensions.bcmath",
  "php83Extensions.tokenizer",
  "php83Extensions.ctype",
  "php83Extensions.fileinfo",
  "php83Extensions.openssl",
  "php83Extensions.intl",
  "composer"
]

[phases.build]
cmds = [
  "cd core && composer install --no-dev --optimize-autoloader --no-interaction 2>&1 || true",
  "mkdir -p core/storage/logs core/storage/framework/sessions core/storage/framework/views core/storage/framework/cache core/bootstrap/cache",
  "chmod -R 775 core/storage core/bootstrap/cache"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t /app"
