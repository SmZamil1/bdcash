[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.curl",
  "php83Extensions.zip",
  "php83Extensions.gd",
  "php83Extensions.bcmath",
  "php83Extensions.tokenizer",
  "php83Extensions.ctype",
  "php83Extensions.fileinfo",
  "php83Extensions.openssl",
  "php83Extensions.intl",
  "php83Extensions.dom",
  "php83Extensions.session",
  "composer"
]

[phases.install]
cmds = [
  "cd core && composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
  "mkdir -p core/storage/logs core/storage/framework/sessions core/storage/framework/views core/storage/framework/cache/data core/bootstrap/cache",
  "chmod -R 777 core/storage core/bootstrap/cache",
  "touch core/storage/logs/laravel.log",
  "cd core && php artisan config:cache || true",
  "cd core && php artisan route:cache || true",
  "cd core && php artisan view:cache || true"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t /app"
